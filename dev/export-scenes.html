<!doctype html><html lang="en"><meta charset="utf-8"><title>Codex Meter · Scene previews</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#191d24;color:#f3f2ee;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{height:720px;padding:38px 48px;background:radial-gradient(ellipse at 15% 0,#303d3c88,transparent 55%)}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}h1{margin:0;font-size:30px;font-weight:500;letter-spacing:-1px}.eyebrow{color:#9eb3a9;font-size:12px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.tile{padding:14px;background:#ffffff08;border:1px solid #ffffff0b;border-radius:18px;height:260px}canvas{display:block;width:100%;height:174px;background:#151c2377;border-radius:12px;image-rendering:pixelated}h2{font-size:14px;font-weight:500;margin:16px 0 5px}p{font-size:11px;color:#aeb7b6;margin:0}.note{display:flex;flex-direction:column;justify-content:center;padding:28px;color:#b3c6b8}.note b{font-size:23px;font-weight:400;line-height:1.4}.note p{line-height:1.7;margin-top:18px}.solo{display:flex;flex-direction:column;align-items:center}.solo canvas{width:960px;height:440px;margin-top:15px}.solo h2{font-size:24px;margin-top:24px}.solo p{font-size:14px}.bottom{margin-top:20px;display:flex;justify-content:space-between;color:#8e9b9d;font-size:11px}
</style><main><header><h1>Codex Meter</h1><span class="eyebrow">A LITTLE COMPANY FOR BIG IDEAS</span></header><div id="scenes"></div><div class="bottom"><span>Pixel companion · Character landscapes · Real account quota</span><span>Scene artwork preview · v1.5.1</span></div></main>
<script src="../ui/pattern-field.js"></script><script src="../ui/texture.js"></script><script src="../ui/pet.js"></script>
<script>
const scenes=[['typing','Deep work','A quiet forest workspace'],['cooking','Cooking ideas','Warm hills, a little steam'],['tennis','In the flow','Green slopes and a perfect swing'],['photo','A new perspective','Soft dunes and a camera'],['flight','Above the clouds','Layered mountains, turning propeller'],['music','Take your time','A moonlit lake while we wait'],['done','A little celebration','Confetti for a finished turn']];
const selected=new URLSearchParams(location.search).get('scene');const list=selected?scenes.filter(s=>s[0]===selected):scenes;const root=document.querySelector('#scenes');root.className=selected?'solo':'grid';
for(const [scene,title,caption] of list){const tile=document.createElement('section');if(!selected)tile.className='tile';const canvas=document.createElement('canvas');canvas.setAttribute('aria-label',title);tile.append(canvas);const h=document.createElement('h2');h.textContent=title;tile.append(h);const p=document.createElement('p');p.textContent=caption;tile.append(p);root.append(tile);CrabPet.draw(canvas,{scene,time:1200,theme:'dark',reduced:false});}
if(!selected){const note=document.createElement('section');note.className='tile note';note.innerHTML='<b>7 scenes.<br>One companion.</b><p>Designed with Tori + Codex.<br>Unified ASCII landscapes.<br>Built for your desktop.</p>';root.append(note);}
</script></html>
